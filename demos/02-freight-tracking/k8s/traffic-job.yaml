apiVersion: batch/v1
kind: Job
metadata:
  name: freight-traffic
  namespace: contoso-freight
  labels:
    app: freight-traffic
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: freight-traffic
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-tracking
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://shipment-tracking:8080/health; do sleep 2; done
      containers:
        - name: loadgen
          image: quay.io/bharathappali/jafra-demo:02-freight-tracking
          imagePullPolicy: IfNotPresent
          args:
            - loadgen
            - --target
            - http://shipment-tracking:8080
            - --rps
            - "120"
            - --time-scale
            - "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
